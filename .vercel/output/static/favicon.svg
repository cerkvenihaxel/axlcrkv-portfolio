<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="64" fill="#0a0a0a"/>
  
  <!-- Gradient border -->
  <defs>
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00ccff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Border circle -->
  <circle cx="64" cy="64" r="60" fill="none" stroke="url(#borderGradient)" stroke-width="4"/>
  
  <!-- Inner circle -->
  <circle cx="64" cy="64" r="56" fill="#111111"/>
  
  <!-- Text AC -->
  <text x="64" y="78" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#00ff88" text-anchor="middle">AC</text>
</svg>
